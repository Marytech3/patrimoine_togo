databases:
  - name: patrimoine-db
    plan: free
    databaseName: patrimoine
    user: patrimoine
    region: frankfurt

services:
  - type: web
    name: patrimoine-togo
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./asset-service/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: patrimoine-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: patrimoine-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: patrimoine-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: patrimoine-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: patrimoine-db
          property: password
